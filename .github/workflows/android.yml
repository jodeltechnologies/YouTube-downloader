name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Pocket-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish installable preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Video-Pocket.apk
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --title "Video Pocket Android preview" --prerelease --notes "Standalone Android 10+ preview. Download Video-Pocket.apk below. No server or ChatGPT account is required. Physical-phone testing is still needed."
          fi
          gh release upload preview Video-Pocket.apk --clobber
